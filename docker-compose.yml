# 개발용 PostgreSQL. 5432 는 다른 프로젝트가 쓸 수 있어 기본 5433 으로 엽니다.
services:
  postgres:
    image: postgres:15-alpine
    container_name: gyeongbug-postgres
    environment:
      POSTGRES_DB: gbexp
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 필요합니다}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - gyeongbug-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d gbexp']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gyeongbug-postgres-data:
